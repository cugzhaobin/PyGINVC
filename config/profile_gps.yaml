# GPS-only profile inversion for the Xianshuihe fault.
#
#     ProfileInversion.py --cfgfile example/config_gps.yaml
#
# The velocity file is example/camp_huan_2009_2014.vel (not redistributed;
# supply your own .vel or .gmtvec).

profile:
  name: XSH_kangding
  origin: [102.190, 29.340]      # lon, lat
  strike: 345                    # degree, clockwise from north
  along:  [-70, 70]              # km
  normal: [-300, 300]            # km
  frame: pyginvc                 # pyginvc (PyGINVC) | localenu (legacy)

model:
  type: strike2d                 # strike2d | dip2d | oblique2d | okada3d
  sense_ss: left

datasets:
  - type: gps
    path: camp_huan_2009_2014.vel
    label: GPS
    weight: 1.0

parameters:                      # free parameters and uniform bounds
  slip_ss: [0.1, 30]
  lock:    [1, 40]
  # Nuisance offsets are named <dataset label>.<component>.
  # strike2d fits only the fault-parallel component, so only GPS.par
  # applies; a norm offset is used by dip2d/oblique2d.
  GPS.par: [-50, 50]
  # GPS.norm: [-50, 50]

estimator:
  type: mcmc                     # leastsq | mcmc
  nwalkers: 32
  nsteps: 3000
  jitter: true
  seed: 0

output:
  dir: out
