############################################################################
#  PyGINVC 滑动反演配置（多断层 + 多数据文件版）
#
#  结构分三层：
#    1. global    —— 全局反演设置（平滑、参考原点、Green 文件）
#    2. faults    —— 每条断层一个条目，逐断层独立几何/格林/边界/平滑
#    3. gps/insar/leveling —— 每个数据文件一个条目，逐文件独立权重/ramp/协方差
############################################################################

# ---------------------------------------------------------------------------
# 1. 全局设置
# ---------------------------------------------------------------------------
global:
    smoothfactor : [0.1, 0.5, 0.1]   # 平滑因子：起、止、步长（未逐断层覆盖时的默认值）
    lapmethod    : '1'               # 1=Laplacian 平滑, 4=Tikhonov 最小范数
    origin       : []                # [lat, lon] 覆盖自动参考原点；留空则自动按断层均值
    greenfile    : 'SAVE'            # 'SAVE'=逐断层保存 green_XX.h5；给路径则生成 {path}_XX.h5 供复用
    # 注意：rake_beta 只能写在每个 faults[].green 段；global 段里的 rake_beta 会被忽略

# ---------------------------------------------------------------------------
# 2. 断层（每条断层一个条目）
# ---------------------------------------------------------------------------
faults:
    - name       : 'seg1'                          # 可选，仅用于日志/标注
      file       : '/path/fault1.faultgeom'        # 单行断层；多行文件请拆成多条断层（doSubFault=True 仅支持单行）
      doSubFault : True                            # True=按 nsegs*ndeps 细分（仅单行文件）；False=每行即一个 patch
      nsegs      : 20                              # 走向方向 patch 数（单值；doSubFault=False 时需 nsegs*ndeps=行数）
      ndeps      : 10                              # 倾向方向 patch 数（单值）
      bcs        : [0, 0, 0, 0]                    # 边界条件：top, bottom, end, start
      green:
          method    : 'okada'                      # okada（均匀半空间）| wang（EDCMP 层状模型）
          greentype : [1, 1, 0]                    # 反演的分量开关：[strike, dip, open]；wang 不支持 open
          nu        : 0.25                         # 泊松比（okada 使用）
          modulus   : 3.0e10                       # 剪切模量 (Pa)
          rake_beta : 0                            # 固定 rake 角(deg)，0=不约束
          # --- 仅 wang（EDCMP）需要：先用 edgrn 生成层状格林函数 ---
          # grndir    : './'                       # EDGRN 输出目录
          # grn_ssfile: 'edgrnhs.ss'
          # grn_dsfile: 'edgrnhs.ds'
          # grn_clfile: 'edgrnhs.cl'
          # edcmp_exe : 'edcmp'                    # EDCMP 可执行文件
      bound:
          ss_range  : [-100, 100]                  # 走滑分量范围 (mm)
          ds_range  : [0, 2000]                    # 倾滑分量范围 (mm)
          op_range  : [0, 0.01]                    # 张裂分量范围 (mm)
          slip_lb   : ''                           # 可选：滑移下界文件（FaultGeom 格式）
          slip_ub   : ''                           # 可选：滑移上界文件（FaultGeom 格式）
      # smoothfactor: [0.1, 0.3, 0.1]              # 可选：本断层覆盖全局平滑因子

    - name       : 'seg2'
      file       : '/path/fault2.faultgeom'
      doSubFault : True
      nsegs      : 30
      ndeps      : 15
      bcs        : [1, 0, 0, 0]
      green:
          method    : 'okada'                      # okada（均匀半空间）| wang（EDCMP 层状模型）
          greentype : [1, 0, 0]                    # 这条断层只反演走滑分量
          nu        : 0.25
          modulus   : 3.0e10
          rake_beta : 30
      bound:
          ss_range  : [-50, 50]
          ds_range  : [-2000, 0]
          op_range  : [0, 0.01]

# ---------------------------------------------------------------------------
# 3. GPS 数据（多个文件，逐个设置）
# ---------------------------------------------------------------------------
gps:
    - file        : '/path/gps_1.gmtvec'
      type        : 'GMT2D'          # 可选：覆盖全局默认类型；建议全 2D 或全 3D，勿混用
      weight      : 1.0              # 该文件整体权重
      ramp        : True             # 是否估计平移/旋转项
      ramp_method : 1                # 1=局部平移旋转；2=球面旋转项
    - file        : '/path/gps_2.gmtvec'
      type        : 'GMT3D'
      weight      : 0.5
      ramp        : False

# ---------------------------------------------------------------------------
# 4. InSAR 数据（多个 track，逐个设置）
# ---------------------------------------------------------------------------
insar:
    - file   : '/path/track_A_los.dat'
      weight : 1.0
      ramp   : True                  # 每个 track 独立决定是否估计 ramp（平移/倾斜）
      sigma  : null                  # 可选：指数协方差幅度（null=单位方差对角）
      lamda  : null                  # 可选：空间相关长度 (km)
    - file   : '/path/track_D_los.dat'
      weight : 0.5
      ramp   : False
      sigma  : 5.0
      lamda  : 2.0

# ---------------------------------------------------------------------------
# 5. 水准数据
# ---------------------------------------------------------------------------
leveling:
    - file   : '/path/level_1.dat'
      weight : 1.0

# ---------------------------------------------------------------------------
# 6. 输出
# ---------------------------------------------------------------------------
export:
    outpath  : './new'
    view     : True                  # True=反演结束后显示观测/模拟对比与滑动分布
    vecscale : null                  # 矢量绘图比例；null=自适应（最长箭头约占图幅 10%），给数值则手动指定
    depth_exaggeration : 2.0         # 三维滑动分布深度方向视觉放大倍数
