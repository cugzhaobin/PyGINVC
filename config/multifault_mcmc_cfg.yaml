############################################################################
#  PyGINVC 贝叶斯（MCMC）滑动反演配置（多断层 + 多数据文件）
#
#  与 multifault_cfg.yaml 完全兼容：global / faults / gps / insar /
#  leveling / export 的写法不变，运行
#
#      python MultiFaultMCMCInversion.py --cfgfile this_file
#
#  另外读取可选的 mcmc 段，控制降维基、先验和采样器。
#  本程序不估计断层几何，只采样：滑动系数、光滑因子、ramp 系数。
############################################################################

global:
    smoothfactor : [0.1, 0.5, 0.1]   # 也用作 MCMC 光滑因子先验范围的默认值
    lapmethod    : '1'               # MCMC 的平滑先验使用同一 Laplacian
    origin       : []
    greenfile    : 'SAVE'
    # 注意：rake_beta 只能写在每个 faults[].green 段；global 段里的 rake_beta 会被忽略

faults:
    - name       : 'seg1'
      file       : '/path/fault1.faultgeom'        # 单行断层（doSubFault=True 仅支持单行）
      doSubFault : True                            # True=按 nsegs*ndeps 细分；False=每行即一个 patch
      nsegs      : 20                              # 单值；doSubFault=False 时需 nsegs*ndeps=行数
      ndeps      : 10
      bcs        : [0, 0, 0, 0]
      green:
          method    : 'okada'
          greentype : [1, 1, 0]
          nu        : 0.25
          modulus   : 3.0e10
          rake_beta : 0
      bound:
          ss_range  : [-100, 100]
          ds_range  : [0, 2000]
          op_range  : [0, 0.01]

    - name       : 'seg2'
      file       : '/path/fault2.faultgeom'
      doSubFault : True
      nsegs      : 30
      ndeps      : 15
      bcs        : [1, 0, 0, 0]
      green:
          method    : 'okada'
          greentype : [1, 0, 0]
          nu        : 0.25
          modulus   : 3.0e10
          rake_beta : 30
      bound:
          ss_range  : [-50, 50]
          ds_range  : [-2000, 0]
          op_range  : [0, 0.01]

gps:
    - file        : '/path/gps_1.gmtvec'
      type        : 'GMT2D'
      weight      : 1.0
      ramp        : True
      ramp_method : 1
    - file        : '/path/gps_2.gmtvec'
      type        : 'GMT3D'
      weight      : 0.5
      ramp        : False

insar:
    - file   : '/path/track_A_los.dat'
      weight : 1.0
      ramp   : True
      sigma  : null
      lamda  : null
    - file   : '/path/track_D_los.dat'
      weight : 0.5
      ramp   : False
      sigma  : 5.0
      lamda  : 2.0

leveling:
    - file   : '/path/level_1.dat'
      weight : 1.0

export:
    outpath  : './new_mcmc'
    view     : True
    vecscale : null
    depth_exaggeration : 2.0

# ---------------------------------------------------------------------------
# MCMC 设置
# ---------------------------------------------------------------------------
mcmc:
    # ---- 降维基 -----------------------------------------------------------
    basis:
        method        : 'laplacian'  # laplacian（低频光滑基）| svd（数据 SVD）
                                     #   | posterior（后验 PCA）| none（不降维）
        nmodes        : 0            # 0 = 自动：按数据能量选 k
        energy        : 0.99         # 自动选 k 时保留的 G_w 能量比例
        min_modes     : 5
        max_modes     : 200
        reference     : 'auto'       # 'auto'/'zero'/数值平滑因子
                                     # auto = 用确定性反演解作参考模型，
                                     # 并把系数 a 解释为相对参考解的扰动
        ref_smoothing : null         # auto 参考解用的平滑因子；null = 先验范围几何中点
        init_scatter  : 0.05         # 各 walker 初始扰动的相对幅度
        dense_limit   : 1800         # 矩阵维数小于此值时用稠密特征分解
        lambda0       : null         # posterior 基的权重；null = ref_smoothing

    # ---- 先验 -------------------------------------------------------------
    prior:
        smoothing:
            dist  : 'loguniform'     # loguniform | uniform | fixed
            lower : 0.02             # null/缺省 = 全局 smoothfactor 最小值 / 10
            upper : 2.0              # null/缺省 = 全局 smoothfactor 最大值 * 10
            # value: 0.2             # dist=fixed 时使用
            normalization : True     # 是否包含 alpha^(-M) 归一化（Fukuda & Johnson）
            # n_effective : 96       # 缺省 = rank(L)；也可手动指定 M
        ramp:
            offset_sigma       : null   # ramp 常数项先验标准差；null = 2*max|d|
            gradient_sigma     : null   # ramp 梯度先验标准差 (data/km)；null = offset/跨度
            gps_offset_sigma   : null   # GPS method 1 平移项；null = offset_sigma
            gps_gradient_sigma : null   # GPS method 1 旋转项；null = gradient_sigma
            gps_rotation_sigma : null   # GPS method 2 球面旋转(rad)；null = offset/6370
        bound_margin : 1e-3          # 参考解向可行域内部收缩量（滑动单位）
        bound_tol    : 1e-6          # 拒绝采样判定边界时的容差
        slip_coeff_sigma : null      # 可选：对降维系数 a 再加零均值高斯先验

    # ---- 采样器 -----------------------------------------------------------
    sampler:
        method   : 'emcee'       # emcee（推荐）| metropolis（无 emcee 时的内置实现）
        moves    : 'de'          # emcee 移动方式：de（差分进化，推荐）
                                 #   | stretch（emcee 默认）| desnooker
        nwalkers : 0             # 0 = max(2*ndim, 32)
        burnin   : 1000
        nsteps   : 3000
        thin     : 5
        seed     : 42
        progress : True
        metropolis:
            nchains      : 4
            adapt_every  : 100
            target_accept: 0.25
            initial_step : 0.1

    # ---- 输出 -------------------------------------------------------------
    output:
        subdir      : 'mcmc'     # 位于 export.outpath 下
        nsamples    : 500        # 保存/统计的后验样本数
        save_samples: True       # 保存 slip_samples / ramp_samples
        save_chain  : True       # 保存展平后的完整链
        plots       : True       # trace / corner
        corner      : True
    view            : True       # 写出 mcmc_solutions.h5 后复用 View 绘图
