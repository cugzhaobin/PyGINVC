<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  :root{--fg:#1f2328;--muted:#6a737d;--line:#e1e4e8;--bg:#f6f8fa;--card:#fff;--accent:#0969da}
  *{box-sizing:border-box}
  body{margin:0;padding:28px;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
       line-height:1.5}
  h1{font-size:22px;margin:0 0 4px}
  h2{font-size:16px;margin:32px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .sub{color:var(--muted);font-size:12px;margin-bottom:20px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:12px;color:var(--muted);margin-bottom:20px}
  .meta b{color:var(--fg);font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
  .card .v{font-size:20px;font-weight:600}
  .card .k{font-size:12px;color:var(--muted);margin-top:2px}
  .card .u{font-size:12px;color:var(--muted)}
  .figs{display:grid;grid-template-columns:1fr;gap:18px}
  figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
  figure img{max-width:100%;height:auto;display:block;border-radius:4px}
  figcaption{font-size:12px;color:var(--muted);margin-top:8px}
  table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card);
        border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  thead th{background:#f0f3f6;font-weight:600}
  tbody tr:last-child td{border-bottom:none}
  .note{font-size:12px;color:var(--muted);margin:6px 0 0}
  ul.dl{list-style:none;padding:0;margin:0;display:grid;
        grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px}
  ul.dl li{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px;
           font-size:13px;display:flex;justify-content:space-between;gap:10px}
  ul.dl a{color:var(--accent);text-decoration:none}
  ul.dl a:hover{text-decoration:underline}
  ul.dl span{color:var(--muted);font-size:11px}
  details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
  summary{cursor:pointer;font-size:13px;color:var(--fg)}
  pre{margin:10px 0 0;font-size:12px;overflow:auto;background:#f6f8fa;padding:12px;border-radius:6px}
  footer{margin-top:36px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<h1>$title</h1>
<div class="sub">$subtitle</div>
$meta
$body
<footer>Generated by PyGINVC.</footer>
</body>
</html>
